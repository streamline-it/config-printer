---
- name: create directory for printing
  ansible.builtin.file:
    path: /var/spool/lpd/lp
    owner: daemon
    group: daemon
    mode: 0770
    state: directory

- name: ensure printcap file is configured for the printer
  loop:
    "{{ config_printer_printers }}"
  notify: restart printer service FreeBSD
  ansible.builtin.lineinfile:
    path: /etc/printcap
    line: "lp:lp=:rm={{ item['ipv4_address'] }}:rp=raw:sh:mx#0:sd=/var/spool/lpd/lp:lf=/var/log/lpd-errs:"
    state: present
