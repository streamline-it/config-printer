---

- name: check to see if the printer exists under cups
  register: config_printer_printer_check
  ansible.builtin.command:
    cmd: grep "{{ config_printer_printers['printer_name'] }}" /usr/local/etc/cups/printers.conf
    
- name: dump variable
  ansible.builtin.debug:
    var: config_printer_printer_check

- name: ensure the printer is added
  when: false
  ansible.builtin.command:
    cmd: "lpadmin -p {{ config_printer_printers['printer_name'] }} -E -v {{ config_printer_printers['printer_path'] }} -m drv:{{ config_printer_printers['driver_filepath'] }}"

