---
- name: ensure needed services are enabled
  loop:
    "{{ config_printer_svc }}"
  community.general.sysrc:
    name: "{{ item }}_enable"
    value: YES
    state: present

- name: check to see if ruleset exists
  register: config_printer_ruleset_check
  ansible.builtin.stat:
    path: "{{ config_printer_ruleset_filepath }}"

- name: ensure file for devfs ruleset file exists
  when: config_printer_ruleset_check['stat']['exists'] == false
  ansible.builtin.copy:
    content: ""
    dest: "{{ config_printer_ruleset_filepath }}"
    owner: root
    group: wheel
    mode: "0644"

- name: ensure devfs ruleset content is setup
  ansible.builtin.blockinfile:
    path: "{{ config_printer_ruleset_filepath }}"
    marker: "{mark} config_printer"
    block: | 
      # needed for cupsd
      [system=10]
      add path 'unlpt*' mode 0660 group cups
      add path 'ulpt*' mode 0660 group cups
      add path 'lpt' mode 0660 group cups

- name: ensure devfs ruleset is enabled
  community.general.sysrc:
    name: "devfs_system_ruleset"
    value: system
    state: present

- name: ensure needed services are started
  loop:
    "{{ config_printer_svc }}"
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
