---
- name: ensure needed services are enabled
  loop:
    "{{ config_printer_svc }}"
  community.general.sysrc:
    name: "{{ item }}_enable"
    value: YES
    state: present

- name: check to see if ruleset exists
  register: config_printer_ruleset_check
  ansible.builtin.stat:
    path: "{{ config_printer_ruleset_filepath }}"

- name: ensure file for devfs ruleset file exists
  when: config_printer_ruleset_check['stat']['exists'] == false
  ansible.builtin.copy:
    content: ""
    dest: "{{ config_printer_ruleset_filepath }}"
    owner: root
    group: wheel
    mode: "0644"

- name: ensure devfs ruleset content is setup
  ansible.builtin.blockinfile:
    path: "{{ config_printer_ruleset_filepath }}"
    marker_begin: "#BEGIN"
    marker_end: "#END"
    marker: "{mark} config_printer"
    block: | 
      # needed for cupsd
      [system=10]
      add path 'unlpt*' mode 0660 group cups
      add path 'ulpt*' mode 0660 group cups
      add path 'lpt' mode 0660 group cups
      add path 'usb/X.Y.Z' mode 0660 group cups

- name: ensure the the devfs service is enabled
  community.general.sysrc:
    name: 'dev_system_ruleset'
    value: YES
    state: present

# The OS can't seem to determine the status of the devfs service so 
# I need to only use service for cupsd.
- name: ensure cups service is started
  loop:
    "{{ config_printer_svc }}"
  when: "item == 'cupsd'"
  ansible.builtin.service:
    name: "{{ item }}"
    state: started

# Now I need to check to see if the devfs filesystem exists to determine
# if I need to start the devfs service
- name: check to see if the devfs filesystem exists
  changed_when: false
  failed_when: false
  register: config_printer_devfscheck
  ansible.builtin.shell:
    executable: /bin/sh
    cmd: $(which df) | grep 'devfs'

- name: ensure the devfs service is running
  loop:
    "{{ config_printer_svc }}"
  when: "config_printer_devfscheck['rc'] == 1 and
     item == 'devfs'"
  ansible.builtin.service:
    name: "{{ item ]}"
    state: started
