- name: ensure variables are available
  ansible.builtin.include_vars:
    "./defaults/{{ ansible_os_family }}.yml"

- name: ensure printing service is configured
  when: false
  notify: restart printer service RedHat
  loop:
    "{{ config_printer_printers }}"
  ansible.builtin.lineinfile:
    line: "ipp://{{ item['ipv4_address'] }}/printers/{{ item['printer_name'] }}"
    path: "{{ config_printer_config_file_path }}"
    backup: true
    state: present
