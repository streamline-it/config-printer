---
- name: ensure variables are pulled in
  ansible.builtin.include_vars:
    "./vars/{{ ansible_os_family }}_vars.yml"

- name: ensure packages are installed (dnf)
  when: ansible_distribution_major_version == "9"
    or ansible_distribution_major_version == "8"
    or ansible_distribution_major_version == "7"
  loop:
    "{{ config_printer_pkgs }}"
  ansible.builtin.dnf:
    name: "{{ item['name'] }}"
    state: present

- name: ensure packages are installed (yum)
  when: ansible_distribution_major_version == "6"
  loop:
    "{{ config_printer_pkgs }}"
  ansible.builtin.yum:
    name: "{{ item['name'] }}"
    state: present
