- name: ensure needed pkg(s) are installed (dnf)
  when: >
    ansible_os_major_version == "9"
    or ansible_os_major_version == "8"
    or ansible_os_major_version == "7"
  loop:
    "{{ printer_config_pkgs }}"
  ansible.builtin.dnf:
    name: "{{ item['name'] }}"
    state: present

- name: ensure needed pkg(s) are installed (yum)
  when: >
    ansible_os_major_version == "6"
  loop:
    "{{ printer_config_pkgs }}"
  ansible.builtin.yum:
    name: "{{ item['name'] }}"
    state: present
