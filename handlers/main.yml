- name: restart printer service
  when: >
    ansible_os_family == "RedHat"
    and ansible_distribution_major_version == "9"
    or ansible_distribution_major_version == "8"
    or ansible_distribution_major_version == "7"
  ansible.builtin.systemd:
    name: "{{ config_printer_printer_svc }}"
    state: restarted

- name: restart printer service
  when: >
    ansible_os_family == "RedHat"
    and ansible_distribution_major_version == "6"
  ansible.builtin.service:
    name: "{{ printer_config_printer_printer_svc }}"
    state: restarted

- name: restart printer service
  when: >
    false
    ansible_os_family == "FreeBSD"
  ansible.builtin.service:
    name: "{{ printer_config_printer_printer_svc }}"
    state: restarted


