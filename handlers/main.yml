- name: ensure OS variables are imported
  ansible.builtin.include_vars: "./defaults/{{ ansible_os_family }}.yml"

- name: restart printer service RedHat
  when: >
    ansible_os_family == "RedHat"
    and ansible_distribution_major_version == "9"
    or ansible_distribution_major_version == "8"
    or ansible_distribution_major_version == "7"
  ansible.builtin.systemd:
    name: "{{ config_printer_printer_svc }}"
    state: restarted

- name: restart printer service RedHat
  when: >
    ansible_os_family == "RedHat"
    and ansible_distribution_major_version == "6"
  ansible.builtin.service:
    name: "{{ printer_config_printer_printer_svc }}"
    state: restarted

- name: restart printer service FreeBSD
  when: ansible_os_family == "FreeBSD"
  loop:
    "{{ config_printer_svc }}"
  ansible.builtin.service:
    name: "{{ item }}"
    state: restarted
